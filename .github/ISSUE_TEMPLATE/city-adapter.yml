name: City adapter proposal
about: Propose or scope a new OpenCityLog city adapter.
title: "City adapter: "
labels: ["city-adapter", "needs-sources"]
body:
  - type: input
    id: city
    attributes:
      label: City / official geography
      placeholder: e.g. Glasgow City Council boundary
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Candidate public sources
      description: List source names, URLs, publishers, licences, and what each source can support.
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Intended stage
      options:
        - Experimental adapter / fixture
        - Partial public adapter
        - Launched 15-lens city
    validations:
      required: true
  - type: textarea
    id: gaps
    attributes:
      label: Known gaps or risks
      description: Missing years, missing lenses, licensing ambiguity, geometry issues, language/localisation needs.
    validations:
      required: true
