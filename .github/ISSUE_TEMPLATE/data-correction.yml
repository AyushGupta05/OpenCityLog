name: Data correction
about: Report an incorrect, missing, duplicated, or overclaimed city-change record.
title: "Data correction: "
labels: ["data-correction", "provenance"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for record/source corrections. OpenCityLog is evidence-first: please include public source links or explain the limitation clearly.
  - type: input
    id: city
    attributes:
      label: City
      description: City or adapter affected.
      placeholder: Belfast / London / NYC / other
    validations:
      required: true
  - type: input
    id: record
    attributes:
      label: Record or source ID
      description: Paste the record ID, source ID, URL, or atlas permalink if available.
    validations:
      required: false
  - type: textarea
    id: issue
    attributes:
      label: What needs correcting?
      description: Describe the incorrect date, geometry, title, source, confidence, licence, or limitation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Public source links, citations, rows, documents, or notes supporting the correction.
    validations:
      required: true
