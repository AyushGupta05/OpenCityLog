name: New public source
about: Suggest a public dataset, register, report, or API for a city adapter.
title: "Source: "
labels: ["source", "data"]
body:
  - type: input
    id: city
    attributes:
      label: City or region
      placeholder: e.g. Belfast, Greater London, New York City
    validations:
      required: true
  - type: input
    id: publisher
    attributes:
      label: Publisher
      placeholder: e.g. city council, transport agency, planning portal
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Source URL
      description: Direct public link to the dataset/page/API/documentation.
    validations:
      required: true
  - type: dropdown
    id: licence
    attributes:
      label: Licence known?
      options:
        - Yes, open licence is stated
        - Licence unclear
        - Restricted or non-open
    validations:
      required: true
  - type: textarea
    id: coverage
    attributes:
      label: Coverage and caveats
      description: Date range, geography, fields, update frequency, and known limitations.
    validations:
      required: true
